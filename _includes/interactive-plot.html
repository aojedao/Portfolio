<div class="project-section-clean" id="interactive-data">
    <h3>{{ page.plot_config.title | default: "System Performance Data" }}</h3>
    <div id="performance-plot"
        style="width:100%; height:400px; background: var(--surface-color); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
        <div id="plot-loading"
            style="display: flex; justify-content: center; align-items: center; height: 100%; color: var(--text-secondary); flex-direction: column; gap: 10px;">
            <div><i class="fas fa-circle-notch fa-spin"></i> &nbsp; Loading Visualization Data...</div>
            <div id="plot-debug" style="font-size: 0.8em; color: var(--text-tertiary);"></div>
        </div>
    </div>

    <script>
        // Use an IIFE to avoid global scope pollution
        (function () {
            const containerId = 'performance-plot';
            const loadingId = 'plot-loading';

            async function initPlot() {
                const loading = document.getElementById(loadingId);
                const debug = document.getElementById('plot-debug');

                function log(msg) {
                    console.log("[InteractivePlot] " + msg);
                    if (debug) debug.innerText = msg;
                }

                // Ensure Plotly is loaded
                if (typeof Plotly === 'undefined') {
                    // Try waiting a moment
                    log("Waiting for Plotly...");
                    await new Promise(r => setTimeout(r, 500));
                    if (typeof Plotly === 'undefined') {
                        log("Error: Plotly library not found.");
                        if (loading) loading.innerHTML = "Error: Plotly library failed to load.";
                        return;
                    }
                }

                {% if page.plot_config %}
                const plotConfig = {
                    x_file: "{{ page.plot_config.x_file | relative_url }}",
                    y_file: "{{ page.plot_config.y_file | relative_url }}",
                    x_label: "{{ page.plot_config.x_label | default: 'Time (s)' }}",
                    y_label: "{{ page.plot_config.y_label | default: 'Value' }}",
                    title: "{{ page.plot_config.title | default: 'System Performance Data' }}"
                };
                {% else %}
                const plotConfig = null;
                {% endif %}

                let xData = [];
                let yData = [];

                if (plotConfig && plotConfig.x_file && plotConfig.y_file) {
                    try {
                        log("Fetching data files...");
                        const [xRes, yRes] = await Promise.all([
                            fetch(plotConfig.x_file),
                            fetch(plotConfig.y_file)
                        ]);

                        if (!xRes.ok || !yRes.ok) throw new Error(`Fetch failed: X:${xRes.status} Y:${yRes.status}`);

                        const xText = await xRes.text();
                        const yText = await yRes.text();

                        log("Parsing data...");

                        // Robust Parsing Helper
                        // Handles both Newline-separated and Comma-separated (single line) data
                        const parseData = (text) => {
                            if (!text) return [];
                            // Replaces newlines with commas, then splits by comma
                            // This effectively flattens any CSV/Column structure into a single sequence
                            // Then filters for valid numbers
                            return text.replace(/[\r\n]+/g, ',').split(',').map(s => parseFloat(s)).filter(n => !isNaN(n));
                        };

                        xData = parseData(xText);
                        yData = parseData(yText);

                        if (xData.length === 0 || yData.length === 0) {
                            throw new Error("No valid numeric data found in files.");
                        }

                        log(`Data parsed. X: ${xData.length} pts, Y: ${yData.length} pts`);

                        // Data Decimation for Performance (if huge)
                        const MAX_POINTS = 10000;
                        if (xData.length > MAX_POINTS) {
                            const step = Math.ceil(xData.length / MAX_POINTS);
                            xData = xData.filter((_, i) => i % step === 0);
                            yData = yData.filter((_, i) => i % step === 0);
                            log(`Decimated to ~${xData.length} points.`);
                        }

                    } catch (err) {
                        console.error(err);
                        if (loading) loading.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${err.message}`;
                        return;
                    }
                } else {
                    // Fallback Demo Data
                    xData = [0, 1, 2, 3, 4, 5];
                    yData = [10, 15, 13, 17, 20, 25];
                }

                // Plot Setup
                if (document.getElementById(containerId)) {
                    if (loading) loading.style.display = 'none';

                    const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#333';
                    const secondaryColor = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#666';
                    const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim() || '#ddd';

                    const trace = {
                        x: xData,
                        y: yData,
                        mode: 'lines',
                        name: plotConfig ? plotConfig.y_label : 'Data',
                        line: { width: 2, color: '#3b82f6' }
                    };

                    const layout = {
                        paper_bgcolor: 'rgba(0,0,0,0)',
                        plot_bgcolor: 'rgba(0,0,0,0)',
                        font: { color: primaryColor },
                        margin: { l: 50, r: 20, b: 50, t: 30 },
                        xaxis: {
                            title: plotConfig ? plotConfig.x_label : 'X',
                            gridcolor: borderColor,
                            zerolinecolor: borderColor,
                            color: secondaryColor
                        },
                        yaxis: {
                            title: plotConfig ? plotConfig.y_label : 'Y',
                            gridcolor: borderColor,
                            zerolinecolor: borderColor,
                            color: secondaryColor
                        },
                        showlegend: true,
                        legend: { orientation: 'h', y: -0.2 }
                    };

                    Plotly.newPlot(containerId, [trace], layout, { responsive: true, displayModeBar: false });
                }
            }

            // Run initialization
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initPlot);
            } else {
                initPlot();
            }
        })();
    </script>
</div>
