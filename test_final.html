<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Final Plot Test</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .test { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .plot { width: 100%; height: 400px; border: 1px solid #ccc; margin: 20px 0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .ok { background: #d4edda; color: #155724; }
        .err { background: #f8d7da; color: #721c24; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>Simple Plot Test - Matching Handler Logic</h1>
    
    <div class="test">
        <h2>Test 1: Ebarisbot (Flat CSV - Single Line)</h2>
        <div id="plot1" class="plot"></div>
        <div id="status1" class="status">Loading...</div>
    </div>

    <div class="test">
        <h2>Test 2: Servos Cartesian (Column-based CSV)</h2>
        <div id="plot2" class="plot"></div>
        <div id="status2" class="status">Loading...</div>
    </div>

    <div class="test">
        <h2>Test 3: Servos Joint Angles (Multi-column CSV)</h2>
        <div id="plot3" class="plot"></div>
        <div id="status3" class="status">Loading...</div>
    </div>

    <script>
        // Match the handler's parsing functions exactly
        const parseCSVFlat = (csvText) => {
            if (!csvText) return [];
            return csvText
                .replace(/[\r\n]+/g, ',')
                .split(',')
                .map(v => v.trim())
                .filter(v => v !== '' && !isNaN(parseFloat(v)))
                .map(Number);
        };

        const parseCSVColumns = (csvText) => {
            if (!csvText) return [];
            const lines = csvText.trim().split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) return [];
            
            const firstLineParts = lines[0].split(',').map(v => v.trim());
            const firstLineIsHeader = firstLineParts.some(v => isNaN(parseFloat(v)));
            
            const dataLines = firstLineIsHeader ? lines.slice(1) : lines;
            return dataLines.map(line =>
                line.split(',').map(v => {
                    const num = parseFloat(v.trim());
                    return isNaN(num) ? null : num;
                })
            );
        };

        const setStatus = (id, msg, type) => {
            document.getElementById(id).className = `status ${type}`;
            document.getElementById(id).textContent = msg;
        };

        async function test1() {
            try {
                const xRes = await fetch('/assets/schematics/ebarisbot/data/t_simple.csv');
                const yRes = await fetch('/assets/schematics/ebarisbot/data/Torque_simple.csv');
                
                if (!xRes.ok) throw new Error(`X file: HTTP ${xRes.status}`);
                if (!yRes.ok) throw new Error(`Y file: HTTP ${yRes.status}`);
                
                const xRaw = await xRes.text();
                const yRaw = await yRes.text();
                
                // Try columns first
                let xData = [];
                const xCols = parseCSVColumns(xRaw);
                if (xCols.length > 0) {
                    xData = xCols.map(row => row[0]).filter(v => v !== null);
                }
                
                // Fall back to flat
                if (xData.length === 0) {
                    xData = parseCSVFlat(xRaw);
                }
                
                // Same for Y
                let yData = [];
                const yCols = parseCSVColumns(yRaw);
                if (yCols.length > 0) {
                    yData = yCols.map(row => row[0]).filter(v => v !== null);
                }
                
                if (yData.length === 0) {
                    yData = parseCSVFlat(yRaw);
                }
                
                if (xData.length === 0) throw new Error("X data empty");
                if (yData.length === 0) throw new Error("Y data empty");
                
                const minLen = Math.min(xData.length, yData.length);
                xData = xData.slice(0, minLen);
                yData = yData.slice(0, minLen);
                
                Plotly.newPlot('plot1', [{
                    x: xData,
                    y: yData,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Motor Torque'
                }], {
                    title: 'Torque Profile Over Time',
                    xaxis: { title: 'Time (s)' },
                    yaxis: { title: 'Torque (Nm)' },
                    responsive: true
                });
                
                setStatus('status1', `✓ Loaded ${xData.length} points`, 'ok');
            } catch (err) {
                setStatus('status1', `✗ ${err.message}`, 'err');
                console.error('Test 1:', err);
            }
        }

        async function test2() {
            try {
                const res = await fetch('/assets/data/servos/robot_cartesian_simple.csv');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const raw = await res.text();
                
                const cols = parseCSVColumns(raw);
                if (cols.length === 0) throw new Error("Column parsing failed");
                
                const xData = cols.map(row => row[0]).filter(v => v !== null);
                const yData = cols.map(row => row[1]).filter(v => v !== null);
                
                if (xData.length === 0) throw new Error("X data empty");
                if (yData.length === 0) throw new Error("Y data empty");
                
                Plotly.newPlot('plot2', [{
                    x: xData,
                    y: yData,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'End Effector Path'
                }], {
                    title: 'Cartesian Path (X vs Y)',
                    xaxis: { title: 'X Position (m)' },
                    yaxis: { title: 'Y Position (m)' },
                    responsive: true
                });
                
                setStatus('status2', `✓ Loaded ${xData.length} points`, 'ok');
            } catch (err) {
                setStatus('status2', `✗ ${err.message}`, 'err');
                console.error('Test 2:', err);
            }
        }

        async function test3() {
            try {
                const res = await fetch('/assets/data/servos/robot_joint_simple.csv');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const raw = await res.text();
                
                const cols = parseCSVColumns(raw);
                if (cols.length === 0) throw new Error("Column parsing failed");
                
                const timeData = cols.map(row => row[0]).filter(v => v !== null);
                const theta1Data = cols.map(row => row[1]).filter(v => v !== null);
                const theta2Data = cols.map(row => row[2]).filter(v => v !== null);
                
                if (timeData.length === 0) throw new Error("Time data empty");
                
                const trace1 = {
                    x: timeData,
                    y: theta1Data,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Joint 1 Angle'
                };
                
                const trace2 = {
                    x: timeData,
                    y: theta2Data,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Joint 2 Angle'
                };
                
                Plotly.newPlot('plot3', [trace1, trace2], {
                    title: 'Joint Angles Over Time',
                    xaxis: { title: 'Time (s)' },
                    yaxis: { title: 'Angle (rad)' },
                    responsive: true,
                    legend: { orientation: 'h', y: -0.15 }
                });
                
                setStatus('status3', `✓ Loaded ${timeData.length} points for 2 angles`, 'ok');
            } catch (err) {
                setStatus('status3', `✗ ${err.message}`, 'err');
                console.error('Test 3:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            test1();
            test2();
            test3();
        });
    </script>
</body>
</html>
