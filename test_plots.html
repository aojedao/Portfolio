<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Testing</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .plot { height: 400px; border: 1px solid #ddd; margin: 20px 0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plotly Integration Tests</h1>
        
        <div class="test-section">
            <h2>Test 1: Servos - Cartesian Path (X vs Y)</h2>
            <div id="plot1" class="plot"></div>
            <div id="status1" class="status">Loading...</div>
        </div>

        <div class="test-section">
            <h2>Test 2: Servos - Joint Angles Over Time</h2>
            <div id="plot2" class="plot"></div>
            <div id="status2" class="status">Loading...</div>
        </div>

        <div class="test-section">
            <h2>Test 3: Ebarisbot - Torque Profile Over Time</h2>
            <div id="plot3" class="plot"></div>
            <div id="status3" class="status">Loading...</div>
        </div>
    </div>

    <script>
        const parseCSVFlat = (csvText) => {
            if (!csvText) return [];
            return csvText
                .replace(/[\r\n]+/g, ',')
                .split(',')
                .map(v => v.trim())
                .filter(v => v !== '')
                .map(Number)
                .filter(n => !isNaN(n));
        };

        const parseCSVColumns = (csvText) => {
            if (!csvText) return [];
            const lines = csvText.trim().split(/\r?\n/);
            // Skip header row
            return lines.slice(1).map(line =>
                line.split(',')
                    .map(v => parseFloat(v.trim()))
                    .filter(n => !isNaN(n))
            );
        };

        // Test 1: Cartesian Path
        async function test1() {
            try {
                const statusEl = document.getElementById('status1');
                const plotEl = document.getElementById('plot1');
                
                // Fetch data
                const cartesianRes = await fetch('/assets/data/servos/robot_cartesian_path.csv');
                if (!cartesianRes.ok) throw new Error(`File not found: ${cartesianRes.status}`);
                const cartesianData = await cartesianRes.text();
                
                // Parse
                const cols = parseCSVColumns(cartesianData);
                if (cols.length === 0) throw new Error("No data parsed");
                
                const xData = cols.map(row => row[0]);
                const yData = cols.map(row => row[1]);
                
                // Plot
                const trace = {
                    x: xData,
                    y: yData,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'End Effector Path',
                    line: { color: '#3b82f6', width: 2 }
                };
                
                const layout = {
                    title: 'Cartesian Path (X vs Y)',
                    xaxis: { title: 'X Position (m)' },
                    yaxis: { title: 'Y Position (m)' },
                    responsive: true
                };
                
                Plotly.newPlot('plot1', [trace], layout, { responsive: true });
                statusEl.className = 'status pass';
                statusEl.textContent = `✓ PASS: Loaded ${xData.length} data points`;
            } catch (err) {
                document.getElementById('status1').className = 'status fail';
                document.getElementById('status1').textContent = `✗ FAIL: ${err.message}`;
                console.error('Test 1 error:', err);
            }
        }

        // Test 2: Joint Angles
        async function test2() {
            try {
                const statusEl = document.getElementById('status2');
                const plotEl = document.getElementById('plot2');
                
                // Fetch data
                const jointRes = await fetch('/assets/data/servos/robot_joint_dynamics.csv');
                if (!jointRes.ok) throw new Error(`File not found: ${jointRes.status}`);
                const jointData = await jointRes.text();
                
                // Parse
                const cols = parseCSVColumns(jointData);
                if (cols.length === 0) throw new Error("No data parsed");
                
                const timeData = cols.map(row => row[0]);
                const theta1Data = cols.map(row => row[1]);
                const theta2Data = cols.map(row => row[2]);
                
                // Plot
                const trace1 = {
                    x: timeData,
                    y: theta1Data,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Joint 1 Angle (Theta 1)',
                    line: { color: '#10b981', width: 2 }
                };
                
                const trace2 = {
                    x: timeData,
                    y: theta2Data,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Joint 2 Angle (Theta 2)',
                    line: { color: '#ef4444', width: 2 }
                };
                
                const layout = {
                    title: 'Joint Angles Over Time',
                    xaxis: { title: 'Time (s)' },
                    yaxis: { title: 'Angle (rad)' },
                    responsive: true,
                    legend: { orientation: 'h', y: -0.2 }
                };
                
                Plotly.newPlot('plot2', [trace1, trace2], layout, { responsive: true });
                statusEl.className = 'status pass';
                statusEl.textContent = `✓ PASS: Loaded ${timeData.length} data points for 2 angles`;
            } catch (err) {
                document.getElementById('status2').className = 'status fail';
                document.getElementById('status2').textContent = `✗ FAIL: ${err.message}`;
                console.error('Test 2 error:', err);
            }
        }

        // Test 3: Ebarisbot Torque
        async function test3() {
            try {
                const statusEl = document.getElementById('status3');
                const plotEl = document.getElementById('plot3');
                
                // Fetch data
                const tRes = await fetch('/assets/schematics/ebarisbot/data/t.csv');
                const torqueRes = await fetch('/assets/schematics/ebarisbot/data/Torque_profile2.csv');
                
                if (!tRes.ok) throw new Error(`Time file not found: ${tRes.status}`);
                if (!torqueRes.ok) throw new Error(`Torque file not found: ${torqueRes.status}`);
                
                const tData = await tRes.text();
                const torqueData = await torqueRes.text();
                
                // Parse
                let xValues = parseCSVFlat(tData);
                let yValues = parseCSVFlat(torqueData);
                
                if (xValues.length === 0) throw new Error("Time data empty");
                if (yValues.length === 0) throw new Error("Torque data empty");
                
                // Align lengths
                const minLen = Math.min(xValues.length, yValues.length);
                xValues = xValues.slice(0, minLen);
                yValues = yValues.slice(0, minLen);
                
                // Decimation for performance
                const MAX_POINTS = 8000;
                let step = 1;
                if (xValues.length > MAX_POINTS) {
                    step = Math.ceil(xValues.length / MAX_POINTS);
                }
                xValues = xValues.filter((_, i) => i % step === 0);
                yValues = yValues.filter((_, i) => i % step === 0);
                
                // Plot
                const trace = {
                    x: xValues,
                    y: yValues,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Motor Torque',
                    line: { color: '#8b5cf6', width: 1 }
                };
                
                const layout = {
                    title: 'Torque Profile Over Time',
                    xaxis: { title: 'Time (s)' },
                    yaxis: { title: 'Torque (Nm)' },
                    responsive: true
                };
                
                Plotly.newPlot('plot3', [trace], layout, { responsive: true });
                statusEl.className = 'status pass';
                statusEl.textContent = `✓ PASS: Loaded ${xValues.length} data points (decimated from ${minLen})`;
            } catch (err) {
                document.getElementById('status3').className = 'status fail';
                document.getElementById('status3').textContent = `✗ FAIL: ${err.message}`;
                console.error('Test 3 error:', err);
            }
        }

        // Run all tests
        document.addEventListener('DOMContentLoaded', () => {
            test1();
            test2();
            test3();
        });
    </script>
</body>
</html>
